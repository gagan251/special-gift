<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lamp Post</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Josefin+Sans:wght@600;700&display=swap">
<style>
/* Layout: a night street. Title on top, one lamp scene below. Lamp arches over from the right; a utility box sits at its foot. The light cone carries the handwritten message. */
:root {
  --night: #070b16;
  --night-2: #131e3a;
  --ink: #04060c;
  --lamp: #ffcf5a;
  --cream: #fff4d6;
  --metal: #2b3c51;
  --metal-dark: #17212d;
  --muted: #8f9bbb;
  --font-title: "Josefin Sans", "Trebuchet MS", system-ui, sans-serif;
  --font-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--night);
  color: var(--cream);
  font-family: var(--font-title);
  min-height: 100vh;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background: radial-gradient(120% 70% at 30% 20%, var(--night-2), var(--night) 70%);
  z-index: -2;
}
body::after {
  content: "";
  position: fixed; inset: 0;
  background: radial-gradient(60% 50% at 28% 24%, rgba(255, 207, 90, .22), transparent 70%);
  opacity: 0; transition: opacity 1.2s ease;
  z-index: -1; pointer-events: none;
}
body.lit::after { opacity: 1; }
#stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
#stars i {
  position: absolute; width: 2px; height: 2px; border-radius: 50%;
  background: #cfd8ff; opacity: .5; animation: tw 4s ease-in-out infinite;
}
@keyframes tw { 50% { opacity: .12; } }

header { width: 100%; max-width: 480px; }
h1 { margin: 0; font-size: clamp(30px, 9vw, 42px); line-height: 1; letter-spacing: .06em; font-weight: 700; text-transform: uppercase; text-wrap: balance; }
h1 small {
  display: block; margin-top: 4px;
  font-family: var(--font-hand); font-weight: 600; font-size: 1.05em;
  text-transform: none; letter-spacing: 0; color: var(--lamp);
}

.stage {
  position: relative; width: 100%; max-width: 480px;
  aspect-ratio: 400 / 620;
  container-type: inline-size;
}
.stage svg { overflow: visible; position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* lamp states */
#halo, #pool, #rays, #bulb-glow { opacity: 0; transition: opacity .5s ease; }
.lit #halo, .lit #pool { opacity: 1; transition: opacity 1.2s ease .1s; }
.lit #rays { opacity: 1; transition: opacity .6s ease .2s; }
.lit #bulb-glow { opacity: 1; }
#bulb { fill: #3b3a33; transition: fill .4s; }
.lit #bulb { fill: #fff2b8; }
.lit #bulb, .lit #bulb-glow { animation: flick .9s steps(1) 1; }
@keyframes flick { 0%{opacity:.2} 12%{opacity:1} 20%{opacity:.3} 34%{opacity:1} 44%{opacity:.5} 60%{opacity:1} 100%{opacity:1} }
.lit #rays line { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
#rim { stroke: rgba(160, 180, 230, .28); transition: stroke .8s; }
.lit #rim { stroke: rgba(255, 220, 140, .5); }

/* light cone + message */
.cone {
  position: absolute; left: 3%; top: 16.1%; width: 58%; height: 77.4%;
  pointer-events: none;
}
.reveal { position: absolute; inset: 0; clip-path: inset(0 0 100% 0); transition: clip-path .45s ease-in; }
.lit .reveal { clip-path: inset(0 0 0 0); transition: clip-path 1.3s cubic-bezier(.3,.6,.2,1) .25s; }
.beam {
  position: absolute; inset: 0;
  clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
  background: linear-gradient(to bottom, rgba(255, 207, 90, .55), rgba(255, 207, 90, .10) 85%);
}
.msg { position: absolute; left: 0; right: 0; top: 21%; height: 30%; display: flex; align-items: center; justify-content: center; }
.msg p {
  margin: 0; text-align: center;
  font-family: var(--font-hand); font-weight: 600;
  font-size: 11cqw; line-height: .95;
  color: var(--cream); text-shadow: 0 0 14px rgba(255, 190, 70, .8), 0 0 30px rgba(255, 160, 40, .4);
}
.lit .msg p { animation: beat 2.6s ease-in-out 2.2s infinite; }
@keyframes beat { 50% { transform: scale(1.06); } }
.duo { position: absolute; left: 0; top: 50.6%; width: 64%; aspect-ratio: 732 / 760; pointer-events: none; }
.duo img {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  opacity: 0; transform: translateY(8px) scale(.95); transform-origin: 50% 100%;
  transition: opacity .3s ease, transform .3s ease;
  filter: drop-shadow(0 0 10px rgba(255, 190, 90, .35));
}
.lit .duo img { opacity: 1; transform: none; transition: opacity 1.4s ease 2s, transform 1.6s ease 2s; }
.heart { position: absolute; left: 2%; top: -14%; width: 96%; overflow: visible; filter: drop-shadow(0 0 8px rgba(255, 80, 120, .8)); }
.heart .fill { fill: url(#g-heart); opacity: 0; transition: opacity .3s ease; }
.heart .line { fill: none; stroke: url(#g-heart-line); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; transition: opacity .3s ease; }
.lit .heart .line { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset 2.2s cubic-bezier(.5,0,.2,1) 1s, opacity .4s ease 1s; }
.lit .heart .fill { opacity: 1; transition: opacity 1.8s ease 2.4s; }
.lit .heart { animation: throb 1.8s ease-in-out 4.2s infinite; transform-origin: 50% 55%; }
@keyframes throb { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.05); } 28% { transform: scale(1); } 42% { transform: scale(1.04); } 56% { transform: scale(1); } }
.float { position: absolute; bottom: 30%; color: #ff6b8e; opacity: 0; font-size: 14px; text-shadow: 0 0 8px rgba(255, 90, 130, .9); }
.lit .float { animation: rise 4.5s ease-out infinite; animation-delay: var(--fd); }
@keyframes rise { 0% { opacity: 0; transform: translateY(0) scale(.6); } 15% { opacity: .9; } 100% { opacity: 0; transform: translateY(-170px) translateX(var(--dx)) scale(1.1); } }
.w { opacity: 0; transition: opacity .25s ease; display: inline-block; white-space: pre; }
.lit .w { opacity: 1; transition: opacity .8s ease var(--d, 0s); }

/* the box */
.box { position: absolute; left: 63%; top: 73.5%; width: 34%; height: 20%; perspective: 700px; }
.crate {
  position: absolute; inset: 0; border-radius: 4px;
  background: linear-gradient(160deg, #101a26, #0a111a);
  border: 2px solid var(--ink);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .6);
}
.panel {
  position: absolute; inset: 0; border-radius: 3px; overflow: hidden;
  visibility: hidden; transition: visibility 0s linear .5s;
}
.open .panel { visibility: visible; transition-delay: 0s; }
.lever { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: pointer; display: block; }
.lever svg { width: 100%; height: 100%; display: block; overflow: visible; }
.lever .blade { transform-box: view-box; transform-origin: 28px 88px; transform: rotate(-72deg); transition: transform .5s cubic-bezier(.5, -.1, .3, 1.35); }
.lever[aria-checked="true"] .blade { transform: rotate(0deg); }
.lever .ring { fill: none; stroke: #ff7a7a; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: ring 1.6s ease-out infinite; }
.lever[aria-checked="true"] .ring { display: none; }
@keyframes ring { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
.lever .led { fill: #3a2a1c; transition: fill .3s; }
.lit .lever .led { fill: var(--lamp); filter: drop-shadow(0 0 3px #ffcf5a); }
.lever .spark { opacity: 0; stroke: #fff3b0; stroke-width: 1.6; stroke-linecap: round; transform-box: fill-box; transform-origin: center; }
.lit .lever .spark { animation: spark .5s ease-out .38s 1; }
@keyframes spark { 0% { opacity: 1; transform: scale(.4); } 100% { opacity: 0; transform: scale(1.6); } }
.shut {
  position: absolute; left: 6px; bottom: 5px; z-index: 2;
  background: none; border: 0; color: #a99a7e; font: 700 9px var(--font-title); letter-spacing: .12em;
  cursor: pointer; padding: 4px 4px; text-transform: uppercase;
}
.shut:hover { color: var(--cream); }
.door {
  position: absolute; inset: 0; border-radius: 4px; cursor: pointer;
  border: 2px solid var(--ink);
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 7px), linear-gradient(160deg, #35495f, var(--metal) 55%, #223245);
  transform-origin: left center; transition: transform .8s cubic-bezier(.5,0,.2,1), opacity .4s ease .35s;
  color: var(--cream); font: 700 clamp(9px, 2.5cqw, 11px)/1.2 var(--font-title); letter-spacing: .16em; text-transform: uppercase;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.door::before, .door::after { content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #0e1722; top: 6px; }
.door::before { left: 6px; } .door::after { right: 6px; }
.door .knob { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e7c36a, #8f6a1c); box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.door:focus-visible, .lever:focus-visible, .shut:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }
.open .door { transform: rotateY(-112deg); opacity: 0; pointer-events: none; }
.nudge .door { animation: nudge 2.2s ease-in-out infinite; }
@keyframes nudge { 0%, 70%, 100% { transform: none; } 78% { transform: rotateY(-8deg); } 86% { transform: rotateY(-2deg); } 93% { transform: rotateY(-6deg); } }

#status { margin: 0; min-height: 1.4em; color: var(--muted); font-size: 13px; letter-spacing: .08em; text-align: center; }

@media (prefers-reduced-motion: reduce) {
  .lit .msg p { animation: none; }
  .duo img, .lit .duo img, .heart .line, .lit .heart .line, .lit .heart .fill { transition-duration: .01s; transition-delay: 0s; }
  .lit .heart, .lit .float { animation: none; }
  .nudge .door, .lit #bulb, .lit #bulb-glow, .lit #rays line, #stars i { animation: none; }
  .reveal, .lit .reveal, .w, .lit .w, .door { transition-duration: .01s; transition-delay: 0s; }
}
</style>
</head>

<main class="stage" id="stage">

    </g>

  <div class="box nudge" id="box">
    <div class="crate">
      <div class="panel" id="panel">
        <button class="lever" id="switch" type="button" role="switch" aria-checked="false" aria-label="Street lamp power lever">
          <svg viewBox="0 0 136 120" aria-hidden="true">
            <defs>
              <linearGradient id="g-brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0cd79"/><stop offset="1" stop-color="#8a6a1e"/></linearGradient>
              <linearGradient id="g-plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2a1e"/><stop offset="1" stop-color="#1c130d"/></linearGradient>
              <radialGradient id="g-knob" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff8a7a"/><stop offset="1" stop-color="#a8231f"/></radialGradient>
            </defs>
            <rect x="2" y="2" width="132" height="116" rx="5" fill="url(#g-plate)"/>
            <rect x="2.75" y="2.75" width="130.5" height="114.5" rx="4.5" fill="none" stroke="#6d5236" stroke-width="1"/>
            <g fill="#8a6a1e"><circle cx="10" cy="10" r="2"/><circle cx="126" cy="10" r="2"/><circle cx="10" cy="110" r="2"/><circle cx="126" cy="110" r="2"/></g>
            <g font-family="Josefin Sans, sans-serif" font-weight="700" font-size="8" letter-spacing="1.2" fill="#b8a27a">
              <text x="126" y="22" text-anchor="end">MAIN LAMP</text>
              <text x="12" y="22">OFF</text>
              <text x="124" y="106" text-anchor="end">ON</text>
            </g>
            <circle class="led" cx="118" cy="38" r="4"/>
            <rect x="12" y="92" width="34" height="5" rx="2" fill="#0f0a07"/>
            <circle cx="28" cy="88" r="7" fill="url(#g-brass)"/>
            <path d="M106 80 v16 M106 80 h6 M106 96 h6" stroke="url(#g-brass)" stroke-width="4" stroke-linecap="round" fill="none"/>
            <g class="spark"><line x1="106" y1="88" x2="106" y2="76"/><line x1="106" y1="88" x2="116" y2="80"/><line x1="106" y1="88" x2="118" y2="90"/><line x1="106" y1="88" x2="114" y2="98"/></g>
            <g class="blade">
              <rect x="26" y="85" width="76" height="6" rx="3" fill="url(#g-brass)"/>
              <circle cx="96" cy="88" r="8" fill="url(#g-knob)" stroke="#5a0f0d" stroke-width="1"/>
              <circle class="ring" cx="96" cy="88" r="8"/>
            </g>
            <circle cx="28" cy="88" r="3" fill="#5c4513"/>
          </svg>
        </button>
        <button class="shut" id="shut" type="button" aria-label="Close box">&#10005; Close</button>
      </div>
    </div>
    <button class="door" id="door" type="button" aria-expanded="false" aria-controls="panel">
      <span>Open</span><span class="knob"></span>
    </button>
  </div>
</main>

<p id="status">The lamp is off. Open the box at its foot.</p>

<script>
(function () {
  var body = document.body, box = document.getElementById('box');
  var door = document.getElementById('door'), sw = document.getElementById('switch');
  var shut = document.getElementById('shut'), status = document.getElementById('status');
  var panel = document.getElementById('panel');
  var msg = document.getElementById('message');

  // stars
  var stars = document.getElementById('stars');
  for (var s = 0; s < 55; s++) {
    var i = document.createElement('i');
    i.style.left = (Math.random() * 100) + '%';
    i.style.top = (Math.random() * 85) + '%';
    i.style.animationDelay = (Math.random() * 4) + 's';
    i.style.opacity = (0.2 + Math.random() * 0.5).toFixed(2);
    stars.appendChild(i);
  }

  // split message into words so they can appear one by one
  msg.data = msg.getAttribute('data-text').split(' ');
  msg.data.forEach(function (word, n) {
    var span = document.createElement('span');
    span.className = 'w';
    span.style.setProperty('--d', (0.9 + n * 0.45).toFixed(2) + 's');
    span.textContent = word + (n < msg.data.length - 1 ? ' ' : '');
    msg.appendChild(span);
  });

  var ctx = null;
  function click(high) {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = high ? 900 : 620;
      g.gain.setValueAtTime(.05, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .06);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + .07);
    } catch (e) {}
  }

  function setOpen(open) {
    box.classList.toggle('open', open);
    box.classList.remove('nudge');
    door.setAttribute('aria-expanded', open);
    if (open) { panel.removeAttribute('inert'); setTimeout(function () { sw.focus({ preventScroll: true }); }, 500); }
    else { panel.setAttribute('inert', ''); door.focus({ preventScroll: true }); box.classList.toggle('nudge', !body.classList.contains('lit')); }
    if (!body.classList.contains('lit')) {
      status.textContent = open ? 'Flip the switch.' : 'The lamp is off. Open the box at its foot.';
    }
  }

  function setLight(on) {
    body.classList.toggle('lit', on);
    sw.setAttribute('aria-checked', on);
    status.textContent = on ? 'The lamp is on.' : 'The lamp is off. The dark is quiet again.';
    click(on);
  }

  panel.setAttribute('inert', '');
  door.addEventListener('click', function () { click(true); setOpen(true); });
  shut.addEventListener('click', function () { click(false); setOpen(false); });
  sw.addEventListener('click', function () { setLight(sw.getAttribute('aria-checked') !== 'true'); });
})();
</script>
</body>
